[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-bench"
version = "0.1.0"
description = "Auditable, leakage-aware multi-horizon forecasting experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cl-user-blip"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn>=1.4,<2", "threadpoolctl>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
chronos-bench = "chronos_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["chronos_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
